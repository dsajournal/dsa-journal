<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Robber - Dynamic Programming Visualizer</title>
    <style>
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px; 
            background: #f9fafb; 
            color: #111827; 
        }
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        h2 { margin-top: 0; color: #1f2937; }
        .row { 
            display: flex; 
            gap: 12px; 
            margin: 20px 0; 
            align-items: center; 
        }
        .label { 
            width: 100px; 
            font-weight: 600; 
            color: #4b5563; 
        }
        .box { 
            width: 60px; 
            height: 60px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 2px solid #e5e7eb; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 1.5rem; 
            background: #f3f4f6; 
            transition: all 0.3s ease; 
        }
        .box.active { 
            border-color: #3b82f6; 
            background: #eff6ff; 
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); 
            transform: scale(1.05);
        }
        .box.calculated { 
            background: #10b981; 
            color: white; 
            border-color: #059669; 
        }
        button { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            font-size: 1rem; 
            font-weight: 600;
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        button:hover { background: #2563eb; }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .message-box { 
            min-height: 80px; 
            margin: 30px 0; 
            padding: 20px; 
            background: #e0f2fe; 
            border-radius: 8px; 
            border-left: 5px solid #0ea5e9; 
            font-size: 1.1rem; 
            line-height: 1.6; 
        }
        code {
            background: #bae6fd;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            color: #0369a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>House Robber (LeetCode 198)</h2>
        <p><strong>Goal:</strong> Find the maximum amount of money you can rob. You cannot rob two adjacent houses.</p>

        <div class="row">
            <div class="label">Houses:</div>
            <div id="houses" class="row"></div>
        </div>

        <div class="row">
            <div class="label">DP Array:</div>
            <div id="dp" class="row"></div>
        </div>

        <div class="message-box" id="message">
            Click <strong>Next Step</strong> to evaluate the houses. We will build a DP array where <code>dp[i]</code> stores the maximum money we can collect up to house <code>i</code>.
        </div>
        
        <button id="nextBtn" onclick="nextStep()">Next Step</button>
        <button id="resetBtn" onclick="init()" style="background: #6b7280; margin-left: 10px;">Reset Algorithm</button>
    </div>

    <script>
        // The test case array of money in each house
        const housesData = [2, 7, 9, 3, 1];
        let dpData = [];
        let step = 0;

        function init() {
            step = 0;
            dpData = new Array(housesData.length).fill(0);
            document.getElementById('nextBtn').disabled = false;
            document.getElementById('message').innerHTML = "Click <strong>Next Step</strong> to evaluate the houses. We will build a DP array where <code>dp[i]</code> stores the maximum money we can collect up to house <code>i</code>.";
            render();
        }

        function render() {
            const housesContainer = document.getElementById('houses');
            const dpContainer = document.getElementById('dp');
            housesContainer.innerHTML = '';
            dpContainer.innerHTML = '';

            // Render Houses Array
            housesData.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = `box ${i === step ? 'active' : ''}`;
                div.innerText = val;
                housesContainer.appendChild(div);
            });

            // Render DP Array
            dpData.forEach((val, i) => {
                const div = document.createElement('div');
                div.className = `box ${i < step ? 'calculated' : ''} ${i === step ? 'active' : ''}`;
                div.innerText = (i < step || (i === step && val > 0)) ? val : '-';
                dpContainer.appendChild(div);
            });
        }

        function nextStep() {
            const msg = document.getElementById('message');
            
            if (step === 0) {
                dpData[0] = housesData[0];
                msg.innerHTML = `<strong>Step 1 (Index 0):</strong> There is only one house available to rob. We rob it.<br><code>dp[0] = ${housesData[0]}</code>`;
                step++;
            } 
            else if (step === 1) {
                dpData[1] = Math.max(housesData[0], housesData[1]);
                msg.innerHTML = `<strong>Step 2 (Index 1):</strong> We can rob house 0 OR house 1, but not both. We take the larger value.<br><code>dp[1] = max(${housesData[0]}, ${housesData[1]}) = ${dpData[1]}</code>`;
                step++;
            } 
            else if (step < housesData.length) {
                const robCurrent = dpData[step-2] + housesData[step];
                const skipCurrent = dpData[step-1];
                dpData[step] = Math.max(robCurrent, skipCurrent);
                
                msg.innerHTML = `<strong>Step ${step + 1} (Index ${step}):</strong> We have two choices:<br>
                1. <strong>Rob it:</strong> Add its value (${housesData[step]}) to the max money from two houses ago (dp[${step-2}] = ${dpData[step-2]}) → Total: ${robCurrent}<br>
                2. <strong>Skip it:</strong> Keep the max money from the previous house (dp[${step-1}] = ${dpData[step-1]})<br>
                <code>dp[${step}] = max(${robCurrent}, ${skipCurrent}) = ${dpData[step]}</code>`;
                step++;
            } 
            else {
                msg.innerHTML = `<strong>Algorithm Finished!</strong> The final value in the DP array is our answer. The maximum amount of money we can rob is <strong>${dpData[dpData.length - 1]}</strong>.`;
                document.getElementById('nextBtn').disabled = true;
            }
            
            render();
        }

        // Initialize on page load
        init();
    </script>
</body>
</html>
